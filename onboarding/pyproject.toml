[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vehnway-onboarding"
version = "1.0.0"
description = "Vehicle-setup / calibration service for scoring_pandera -- vehicle identity, phone lever-arm math, following-distance camera calibration, mileage-based engine_efficiency calibration. See README.md."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
onboarding = ["data/*.json"]
